<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GHOST//GRID</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Интерфейс в духе пиксельных игр: плоские панели, прямые углы, один акцентный цвет.
   Крупные надписи и цифры рисуются тем же пиксельным шрифтом 5×7, что и вывески города
   (SVG из квадратиков, размер кратен 7 px), мелкий текст — IBM Plex Mono. */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050b0c;--panel:rgba(5,12,13,.93);--line:#1b3032;--line2:#2b4648;--text:#dcebe6;--muted:#87a6a0;--dim:#5c7773;
--teal:#6fe0c8;--amber:#f2a65a;--pink:#e0508f;--red:#ff4a5a;
--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;left:0;top:0;z-index:0;image-rendering:crisp-edges;image-rendering:pixelated}
button{font:inherit;color:inherit}
.pt{display:block;fill:currentColor;shape-rendering:crispEdges;overflow:visible}
[data-px]{display:block;line-height:0}
kbd{display:inline-block;min-width:18px;padding:0 4px;border:1px solid var(--line2);border-bottom-width:2px;font-family:var(--mono);font-size:11px;line-height:16px;text-align:center;color:var(--text);background:#0a1517}

/* --- игра --- */
.wrap{position:relative;z-index:1;display:flex;gap:18px;align-items:flex-start;justify-content:center;transition:opacity .4s,visibility .4s}
body.inmenu .wrap{opacity:0;visibility:hidden;pointer-events:none}
body.mode-classic .ghost-only{display:none!important}
.frame{position:relative;padding:6px;background:#030809;border:2px solid var(--line2)}
#field{height:min(76vh,600px);aspect-ratio:1/2;max-width:80vw;display:block;background:#030809}
.side{display:flex;flex-direction:column;gap:6px;width:172px}
.brand{padding:9px 10px 9px;font-size:21px;line-height:0;color:var(--text);background:var(--panel);border:1px solid var(--line)}
.brand small{display:block;margin-top:8px;line-height:1.3;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);padding:7px 10px 8px}
.box span{display:block;font-size:11px;color:var(--muted)}
.box b{display:block;margin-top:6px;font-size:21px;line-height:0;color:var(--text)}
#next{width:96px;aspect-ratio:1;display:block;margin:4px auto 0}
.nrg span i{float:right;font-style:normal;color:var(--text)}
.cells{display:flex;gap:2px;margin-top:7px}
.cells i{flex:1;height:8px;background:#11201f}
.cells i.on{background:var(--teal)}
.cells i.cut{margin-left:4px}
.nrg.warn .cells i{background:var(--red)}
.help{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;padding:9px 10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px}
.help kbd{margin-right:2px}
.pad{display:none;gap:8px}
.pad button{width:52px;height:46px;display:flex;align-items:center;justify-content:center;background:#071012;border:2px solid var(--line2);color:var(--teal);touch-action:none}
.pad button:active,.pad button.held{background:#11292a;border-color:var(--teal)}
.pad [data-a="down"]{position:relative;overflow:hidden}.pad [data-a="down"] svg{position:relative}
.pad [data-a="down"]::after{content:"";position:absolute;inset:0;background:rgba(111,224,200,.28);transform:scaleY(0);transform-origin:top}
.pad [data-a="down"].held::after{transform:scaleY(1);transition:transform .3s linear}
.pad button:disabled{opacity:.3}
.pad svg,.ovb svg.ic{width:20px;height:20px;shape-rendering:crispEdges;fill:currentColor}
@media (hover:none){
 /* телефон: поле во всю доступную ширину, счёт — колонкой справа, внизу крестовина кнопок */
 .wrap{display:grid;grid-template-columns:auto 88px;grid-template-areas:"f s" "p p";gap:8px;align-items:start;justify-content:center}
 .frame{grid-area:f;padding:4px}
 #field{max-width:none;height:min(calc(100vh - 150px),calc((100vw - 124px)*2),640px);height:min(calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),calc((100vw - 124px)*2),640px)}
 .side{grid-area:s;flex-direction:column;width:88px;gap:5px}
 .box{padding:5px 6px 6px}.box b{font-size:14px;margin-top:5px}.box span{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nrg span i{display:none}
 #next{width:52px;margin:4px auto 0}
 .cells{margin-top:6px;gap:1px;flex-wrap:wrap}.cells i{flex:0 0 calc(12.5% - 1px);height:6px}.cells i.cut{margin-left:0}
 .help,.brand,.kh{display:none}
 .pad{grid-area:p;display:grid;justify-self:center;grid-template-columns:50px 66px 66px 66px 50px;grid-template-rows:50px 50px;gap:6px}
 .pad [data-a="undo"]{grid-column:1;grid-row:1}
 .pad [data-a="left"]{grid-column:2;grid-row:1/3}
 .pad [data-a="rot"]{grid-column:3;grid-row:1}
 .pad [data-a="down"]{grid-column:3;grid-row:2}
 .pad [data-a="right"]{grid-column:4;grid-row:1/3}
 .pad [data-a="pause"]{grid-column:5;grid-row:1}
 .pad button{width:auto;height:auto}
 .pad .mv svg{width:24px;height:24px}
}

/* --- пауза и конец игры --- */
.ov{position:absolute;inset:6px;z-index:2;display:flex;align-items:center;justify-content:center;background:rgba(3,8,9,.9);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.on{opacity:1;visibility:visible}
.ovin{width:min(220px,84%);text-align:center}
.ovin h2{display:flex;justify-content:center;margin:0 0 18px;font-size:21px;line-height:0;color:var(--text)}
.ovb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:6px 0;padding:11px 12px;font-size:14px;line-height:0;color:var(--text);background:transparent;border:2px solid var(--line2);cursor:pointer}
.ovb:hover,.ovb:focus-visible{border-color:var(--teal);outline:none}
.ovb.pri{background:var(--teal);border-color:var(--teal);color:#05100e}
.ovb.pri:hover{background:#8eeedb}
.ovb.amb{color:var(--amber);border-color:#6a4a2a}
.ovb.amb:hover{border-color:var(--amber)}
.ovb:disabled{opacity:.35;cursor:default}
.kh{margin-top:12px;font-size:11px;line-height:1.9;color:var(--dim)}
.ost{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 14px}
.ost div{padding:6px 4px 7px;background:#081314;border:1px solid var(--line)}
.ost dt{font-size:10px;color:var(--muted)}
.ost dd{display:flex;justify-content:center;margin:5px 0 0;font-size:14px;line-height:0;color:var(--text)}
.rec{display:inline-block;margin:-6px 0 12px;padding:4px 8px;font-size:14px;line-height:0;color:#140b02;background:var(--amber);animation:recb 1s steps(1) infinite}
@keyframes recb{50%{opacity:.35}}

/* --- достижение --- */
#ach{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-160%);transition:transform .35s steps(6);padding:8px 18px 9px;text-align:center;background:#0b0905;border:2px solid var(--amber);pointer-events:none}
#ach.show{transform:translate(-50%,0)}
#ach small{display:block;font-size:11px;color:var(--amber)}
#ach b{display:flex;justify-content:center;margin:6px 0 6px;font-size:21px;line-height:0;color:var(--text)}
#ach span{font-size:11px;color:var(--muted)}

/* --- главное меню --- */
#menu{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
#menu.on{opacity:1;visibility:visible}
#menu::before{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(2,6,7,.25)}
.mwrap{position:relative;width:min(600px,100%);max-height:100%;display:flex;flex-direction:column;padding:30px 34px 24px;background:rgba(3,8,9,.88);border:2px solid var(--line2)}
.logo{display:flex;gap:.14em;margin:0 0 30px;font-size:56px;line-height:0;color:var(--text)}
.logo .sl{color:var(--teal)}
.mpage{display:none}
.mpage.on{display:block}
.mi{position:relative;display:block;width:100%;margin:0 0 6px;padding:12px 16px 13px 40px;text-align:left;background:transparent;border:2px solid transparent;cursor:pointer}
.mi b{display:block;font-size:21px;line-height:0;color:var(--muted)}
.mi small{display:block;margin-top:8px;font-size:12px;color:var(--dim)}
.mi.sel{background:#0a1617;border-color:var(--line2)}
.mi.sel b{color:var(--text)}
.mi.sel::before{content:"";position:absolute;left:14px;top:16px;border:7px solid transparent;border-left:9px solid var(--teal);border-right:0}
.mtitle{margin:0 0 16px;font-size:21px;line-height:0;color:var(--text)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{position:relative;display:block;padding:12px 12px 13px;text-align:left;background:var(--panel);border:2px solid var(--line);cursor:pointer}
.mc canvas{display:block;width:100%;height:auto;margin:0 0 12px;background:#030809;border:1px solid var(--line)}
.mc b{display:block;font-size:14px;line-height:0;color:var(--text)}
.mc p{margin:10px 0 10px;font-size:12px;line-height:1.55;color:var(--muted)}
.mc small{font-size:11px;color:var(--amber)}
.mc.sel{border-color:var(--teal)}
.back{display:inline-block;margin-top:14px;padding:8px 10px;background:transparent;border:2px solid transparent;font-size:14px;line-height:0;color:var(--muted);cursor:pointer}
.back.sel{border-color:var(--line2);color:var(--text)}
.back.dim{margin-left:auto;font-family:var(--mono);font-size:12px;line-height:1;color:var(--dim)}
.back.dim.sel{color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.tile{padding:7px 10px 8px;background:var(--panel);border:1px solid var(--line)}
.tile span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{display:block;margin-top:6px;font-size:14px;line-height:0;color:var(--text)}
.glist{max-height:min(40vh,340px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;background:var(--panel);border:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.gi{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 12px 9px;border-bottom:1px solid var(--line)}
.gl{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:12px;color:var(--muted)}
.gtag{font-size:12px}
.gi.c .gtag{color:var(--teal)}.gi.g .gtag{color:var(--pink)}
.gq{font-size:11px;color:var(--amber)}
.gsc{grid-row:span 2;align-self:center;font-size:14px;line-height:0;color:var(--text)}
.gx{font-size:11px;color:var(--dim)}
.gbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--teal);opacity:.6}
.gi.g .gbar{background:var(--pink)}
.empty{padding:28px 10px;text-align:center;font-size:13px;line-height:1.7;color:var(--muted)}
.lrow{display:flex;align-items:center}
.mfoot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.mfoot kbd{margin:0 2px}
@media (hover:none){.mfoot{display:none}}
@media (max-width:600px){
 .modes{grid-template-columns:1fr}
 .mc{display:flow-root}
 .mc canvas{float:right;width:42%;margin:2px 0 4px 12px}
 .tiles{grid-template-columns:repeat(2,1fr)}
 .mi{padding-left:34px}.mi b{font-size:14px}.mi.sel::before{left:10px;top:13px}
 .logo{font-size:35px}
 .logo{margin-bottom:22px}
 .mwrap{padding:22px 18px 18px}
}
@media (max-height:640px){.logo{font-size:35px;margin-bottom:16px}.glist{max-height:30vh}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="ach"><small>Достижение</small><b data-px="Квадро"></b><span>4 линии за один ход</span></div>
<div id="menu" class="on">
  <div class="mwrap">
    <h1 class="logo" aria-label="GHOST//GRID"><span data-px="GHOST"></span><span class="sl" data-px="//"></span><span data-px="GRID"></span></h1>
    <section class="mpage on" id="pMain">
      <button class="mi" id="mNew"><b data-px="Новая игра"></b></button>
      <button class="mi" id="mLog"><b data-px="Предыдущие игры"></b><small id="mLogSub">пока пусто</small></button>
    </section>
    <section class="mpage" id="pMode">
      <div class="mtitle" data-px="Режим"></div>
      <div class="modes">
        <button class="mc c" id="mClassic"><canvas id="icC" width="168" height="98"></canvas><b data-px="Классика"></b><p>Обычный тетрис. Отмены ходов и вируса нет.</p><small>рекорд <span id="bestC">0</span></small></button>
        <button class="mc g" id="mGhost"><canvas id="icG" width="168" height="98"></canvas><b data-px="Режим Призрака"></b><p>Ходы можно отменять за энергию. Вирус не даёт ряду очиститься, линии рядом его лечат.</p><small>рекорд <span id="bestG">0</span></small></button>
      </div>
      <button class="back" id="mBack1" data-px="Назад"></button>
    </section>
    <section class="mpage" id="pLog">
      <div class="mtitle" data-px="Предыдущие игры"></div>
      <div class="tiles" id="tiles"></div>
      <div class="glist" id="glist"></div>
      <div class="lrow"><button class="back" id="mBack2" data-px="Назад"></button><button class="back dim" id="logClear">очистить</button></div>
    </section>
    <div class="mfoot"><kbd>↑</kbd><kbd>↓</kbd> выбор &nbsp; <kbd>Enter</kbd> выбрать &nbsp; <kbd>Esc</kbd> назад</div>
  </div>
</div>
<div class="wrap">
  <div class="frame"><canvas id="field" width="300" height="600"></canvas>
    <div class="ov" id="ovPause"><div class="ovin"><h2 data-px="Пауза"></h2>
      <button class="ovb pri" id="pResume"><span data-px="Продолжить"></span></button><button class="ovb" id="pRestart"><span data-px="Заново"></span></button><button class="ovb" id="pMenu"><span data-px="В меню"></span></button>
      <p class="kh"><kbd>P</kbd> &nbsp;<kbd>R</kbd> &nbsp;<kbd>M</kbd></p></div></div>
    <div class="ov" id="ovOver"><div class="ovin"><h2 data-px="Игра окончена"></h2><div class="rec" id="oRec"><span data-px="Новый рекорд"></span></div>
      <dl class="ost"><div><dt>счёт</dt><dd id="oSc">0</dd></div><div><dt>линии</dt><dd id="oLn">0</dd></div><div><dt>уровень</dt><dd id="oLv">1</dd></div><div><dt>время</dt><dd id="oTm">0:00</dd></div></dl>
      <button class="ovb amb" id="oUndo"><svg class="ic" viewBox="0 0 10 10"><path d="M2 0h1v1h-1zM1 1h1v1h-1zM2 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM8 3h1v1h-1zM2 4h1v1h-1zM9 4h1v1h-1zM9 5h1v1h-1zM9 6h1v1h-1zM8 7h1v1h-1zM1 8h1v1h-1zM2 8h1v1h-1zM3 8h1v1h-1zM4 8h1v1h-1zM5 8h1v1h-1zM6 8h1v1h-1zM7 8h1v1h-1z"/></svg><span data-px="Отменить ход"></span></button><button class="ovb pri" id="oAgain"><span data-px="Ещё раз"></span></button><button class="ovb" id="oMenu"><span data-px="В меню"></span></button>
      <p class="kh"><kbd>Enter</kbd> ещё раз &nbsp; <span class="ghost-only"><kbd>Z</kbd> отменить &nbsp; </span><kbd>Esc</kbd> меню</p></div></div>
  </div>
  <div class="side">
    <div class="brand"><span data-px="GHOST//GRID"></span><small id="modeTag">Классика</small></div>
    <div class="box"><span>Следующая</span><canvas id="next" width="120" height="120"></canvas></div>
    <div class="box"><span>Счёт</span><b id="sc">0</b></div>
    <div class="box lnbox"><span>Линии</span><b id="ln">0</b></div>
    <div class="box"><span>Уровень</span><b id="lv">1</b></div>
    <div class="box bestbox"><span>Рекорд</span><b id="bs">0</b></div>
    <div class="box nrg ghost-only" id="nrgbox"><span>Энергия <i id="undoN">2 отмены</i></span><div class="cells" id="nrgcells"></div></div>
    <div class="box ghost-only"><span>Вирус</span><b id="vir">0</b></div>
    <div class="help"><span><kbd>←</kbd><kbd>→</kbd></span><span>двигать</span><span><kbd>↑</kbd></span><span>повернуть</span><span><kbd>↓</kbd></span><span>вниз</span><span><kbd>Пробел</kbd></span><span>поставить</span><span class="ghost-only"><kbd>Z</kbd></span><span class="ghost-only">отменить ход</span><span><kbd>P</kbd></span><span>пауза</span></div>
  </div>
  <div class="pad">
    <button class="ghost-only" id="undo" data-a="undo" aria-label="Отменить ход" disabled><svg class="ic" viewBox="0 0 10 10"><path d="M2 0h1v1h-1zM1 1h1v1h-1zM2 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM7 2h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM8 3h1v1h-1zM2 4h1v1h-1zM9 4h1v1h-1zM9 5h1v1h-1zM9 6h1v1h-1zM8 7h1v1h-1zM1 8h1v1h-1zM2 8h1v1h-1zM3 8h1v1h-1zM4 8h1v1h-1zM5 8h1v1h-1zM6 8h1v1h-1zM7 8h1v1h-1z"/></svg></button>
    <button class="mv" data-a="left" aria-label="Влево"><svg class="ic" viewBox="0 0 10 10"><path d="M4 1h1v1h-1zM3 2h2v1h-2zM2 3h3v1h-3zM1 4h8v2h-8zM2 6h3v1h-3zM3 7h2v1h-2zM4 8h1v1h-1z"/></svg></button><button class="mv" data-a="rot" aria-label="Повернуть"><svg class="ic" viewBox="0 0 10 10"><path d="M3 1h4v1h-4zM2 2h1v1h-1zM7 2h1v1h-1zM1 3h1v4h-1zM6 3h3v1h-3zM7 4h1v1h-1zM2 7h1v1h-1zM7 7h1v1h-1zM3 8h4v1h-4z"/></svg></button><button class="mv" data-a="down" aria-label="Вниз"><svg class="ic" viewBox="0 0 10 10"><path d="M4 1h2v8h-2zM1 5h8v1h-8zM2 6h6v1h-6zM3 7h4v1h-4z"/></svg></button><button class="mv" data-a="right" aria-label="Вправо"><svg class="ic" viewBox="0 0 10 10"><path d="M5 1h1v1h-1zM5 2h2v1h-2zM5 3h3v1h-3zM1 4h8v2h-8zM5 6h3v1h-3zM5 7h2v1h-2zM5 8h1v1h-1z"/></svg></button>
    <button data-a="pause" aria-label="Пауза"><svg viewBox="0 0 10 10"><path d="M2 1h2v8h-2zM6 1h2v8h-2z"/></svg></button>
  </div>
</div>
<script>
const W=10,H=20,S=30,FONT='"IBM Plex Mono",monospace',MONO='"IBM Plex Mono",ui-monospace,monospace';

/* Эмпайр-стейт-билдинг по настоящим пропорциям (метры от земли, ширина фасада в метрах):

   крылья до 72-го этажа, смотровая площадка 86-го, мачта для дирижаблей с рёбрами, антенна.

function updateCars(s,H_){
  const w=C.w,mul=1+H_*.6;
  for(let lane=0;lane<4;lane++){
    const L=C.cars.filter(c=>c.lane===lane),d=lane<2?-1:1,front=c=>d>0?c.x+c.w:-c.x,back=c=>d>0?c.x:-(c.x+c.w);
    L.sort((a,b2)=>front(b2)-front(a));
    for(let i=0;i<L.length;i++){const c=L[i],ah=L[i-1];let tg=c.v0*mul;
      if(ah){const gap=back(ah)-front(c),safe=5+c.v*.3;if(gap<safe)tg=Math.min(tg,ah.v*Math.max(0,gap/safe));}
      c.brake=tg<c.v-3?Math.min(1,c.brake+s*6):Math.max(0,c.brake-s*3);
      c.v+=(tg-c.v)*(1-Math.exp(-s*(tg<c.v?5:1)));c.x+=d*c.v*s;
      if(d>0?c.x>w+6:c.x+c.w<-6){                                                   /* уехала — въезжает новая, позади последней в полосе */

function bakeRoad(){

function beam(L0,ai){const L=C.hor+8,k=L+'|'+ai;if(BEAM[k])return BEAM[k];const t=Math.tan(ai/16),ox=Math.ceil(Math.max(0,-t*L))+16,wd=Math.ceil(Math.abs(t)*L)+34,c=layer(wd,L),g=c.getContext('2d');

function draw7(){if(!bag.length){bag=PIECES.slice();for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
let spawnN=0;
function spawn(force){
  let t;spawnN++;

  const m=SH[t].map(r=>r.slice());

function hit(m,px,py){
  for(let r=0;r<m.length;r++)for(let c=0;c<m.length;c++){
    if(!m[r][c])continue;
    const X=px+c,Y=py+r;
    if(X<0||X>=W||Y>=H)return true;
    if(Y>=0&&board[Y][X])return true;
  }
  return false;
}

function tryRotate(){
  if(lockHold||!cur)return;

  for(const k of [0,-1,1,-2,2])if(!hit(m,cur.x+k,cur.y)){cur.m=m;cur.x+=k;return}
}
function move(dx){if(lockHold||!cur)return;if(!hit(cur.m,cur.x+dx,cur.y))cur.x+=dx}
function drop(){
  if(lockHold||!cur)return false;
  if(!hit(cur.m,cur.x,cur.y+1)){cur.y++;return true}
  lock();return false;
}
function hardDrop(){
  if(lockHold||!cur)return;
  const y0=cur.y,px=cur.x,m=cur.m,t=cur.t;

const rowClear=row=>row.every(Boolean)&&!row.includes('X');

function sparkle(cells,bad){

    addP({k:'pix',x:c*S+rnd(4,S-4),y:r*S+rnd(4,S-4),vx:rnd(-90,90),vy:rnd(-160,-30),g:700,s:rnd(2.5,4.5),

}
/* Очистка линий лечит вирус в радиусе n рядов; 4 линии стирают весь вирус */
function cleanse(n,full){
  if(!ghost()||!CFG.virusEvery)return;
  const lo=Math.min(...full)-n,hi=Math.max(...full)+n,cells=[];
  board.forEach((row,r)=>row.forEach((v,c)=>{
    if(v!=='X')return;
    if(n>=4){board[r][c]=0;cells.push([r,c])}
    else if(r>=lo&&r<=hi){board[r][c]=PIECES[Math.floor(Math.random()*PIECES.length)];cells.push([r,c])}
  }));
  if(cells.length)sparkle(cells,false);
}
function seedVirus(){
  const cand=[];
  board.forEach((row,r)=>row.forEach((v,c)=>{if(v&&v!=='X'&&(r===0||!board[r-1][c]))cand.push([r,c])}));
  if(!cand.length)return;
  const [r,c]=cand[Math.floor(Math.random()*cand.length)];
  board[r][c]='X';sparkle([[r,c]],true);
}
function spreadVirus(){
  const vs=[];board.forEach((row,r)=>row.forEach((v,c)=>{if(v==='X')vs.push([r,c])}));
  if(!vs.length)return;
  const [r,c]=vs[Math.floor(Math.random()*vs.length)];
  const nb=[[r+1,c],[r,c-1],[r,c+1],[r-1,c]].filter(([a,d])=>a>=0&&a<H&&d>=0&&d<W&&board[a][d]&&board[a][d]!=='X');
  if(!nb.length)return;
  const [a,d]=nb[Math.floor(Math.random()*nb.length)];
  board[a][d]='X';sparkle([[a,d]],true);
}
function virusTick(){
  if(!ghost()||!CFG.virusEvery)return;
  pieces++;
  if(pieces>=CFG.virusFirst&&(pieces-CFG.virusFirst)%CFG.virusEvery===0)seedVirus();
  else if(pieces%CFG.virusSpread===0)spreadVirus();
}
function nextPiece(){virusTick();ui();spawn()}

function lock(){
  fastKeys.clear();btnFast=false;placed++;
  if(ghost()){
    history.push({board:board.map(r=>r.slice()),t:cur.t,pos:{x:cur.x,y:cur.y,m:cur.m.map(r=>r.slice())},nextT,bag:bag.slice(),score,lines,level,pieces,quads});
    if(history.length>30)history.shift();
  }
  cur.m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&cur.y+r>=0)board[cur.y+r][cur.x+c]=cur.t}));
  const full=[];board.forEach((row,i)=>{if(rowClear(row))full.push(i)});
  const n=full.length,gone=full.map(i=>board[i].slice());
  if(n){
    score+=[0,100,300,500,800][n]*level;lines+=n;level=Math.floor(lines/10)+1;
    if(n===4)quads++;
    if(ghost())energy=Math.min(CFG.energyMax,energy+CFG.energyPerLine[n]);
    cleanse(n,full);
    lockHold={full,n,collapsed:false,collapseAt:gt+FXD[n],spawnAt:0};cur=null;
    spawnFx(n,full,gone);
    cityEvent('clear',n);
  }
  if(n===4&&!achieved){achieved=true;showAch()}
  ui();
  if(state==='run'&&!lockHold)nextPiece();
}
function collapse(){
  const full=lockHold.full,keep=[];
  board.forEach((row,i)=>{if(!full.includes(i))keep.push({row,i})});
  const nb=Array.from({length:H-keep.length},()=>Array(W).fill(0)),shift=Array(H).fill(0);
  keep.forEach((k,j)=>{shift[H-keep.length+j]=H-keep.length+j-k.i;nb.push(k.row)});
  board=nb;
  lockHold.collapsed=true;lockHold.spawnAt=gt+60;
  PT.forEach(p=>{if(p.rest)p.rest=false});
  startFall(shift);
}

function undo(){
  if(!ghost()||!history.length||(state!=='run'&&state!=='over'))return;
  if(energy<CFG.undoCost){warnEnergy();return}
  const s=history.pop();
  energy-=CFG.undoCost;undos++;
  board=s.board;bag=s.bag;nextT=s.nextT;score=s.score;lines=s.lines;level=s.level;pieces=s.pieces;quads=s.quads;
  spaceHeld=false;fx=[];PT=[];trails=[];lockHold=null;fallAnim=null;
  if(state==='over'){state='run';showOverlay(null);cityEvent('start')}
  /* фигура возвращается наверх, на стартовую позицию, но с тем поворотом, с каким её поставили */
  cur=null;
  if(s.pos){
    const m=s.pos.m.map(r=>r.slice()),top=m.findIndex(r=>r.some(Boolean)),x0=Math.floor((W-m.length)/2),y0=-Math.max(0,top);
    for(const k of [0,-1,1,-2,2])if(!hit(m,x0+k,y0)){cur={t:s.t,m,x:x0+k,y:y0};break}
  }
  if(!cur)spawn(s.t);
  acc=0;
  rewind={t0:gt};
  ui();
}
function showAch(){const a=$('ach');a.classList.add('show');setTimeout(()=>a.classList.remove('show'),4200)}
function ui(){
  setPx($('sc'),score);setPx($('ln'),lines);setPx($('lv'),level);setPx($('bs'),Math.max(best,score));
  const nv=countVirus();setPx($('vir'),nv);$('vir').style.color=nv?'#ff3b5c':'';
  let cells='';for(let i=0;i<CFG.energyMax;i++)cells+='<i class="'+(i<energy?'on':'')+(i===CFG.undoCost?' cut':'')+'"></i>';$('nrgcells').innerHTML=cells;
  $('undoN').textContent='отмен: '+Math.floor(energy/CFG.undoCost);
  $('undo').disabled=!ghost()||!history.length||energy<CFG.undoCost;
}
function over(){
  state='over';spaceHeld=false;fastKeys.clear();cityEvent('over');
  const rec=score>best&&score>0;
  if(score>best)best=score;
  saveGame('over');
  setPx($('oSc'),score);setPx($('oLn'),lines);setPx($('oLv'),level);setPx($('oTm'),fmtTime(playMs));
  $('oRec').style.display=rec?'':'none';
  $('oUndo').style.display=ghost()&&history.length?'':'none';
  $('oUndo').disabled=energy<CFG.undoCost;
  showOverlay('ovOver');
}
function start(m){
  if(m)mode=m;
  if(state==='run'||state==='pause')saveGame('quit');
  board=Array.from({length:H},()=>Array(W).fill(0));
  score=0;lines=0;level=1;bag=[];nextT=null;acc=0;spaceHeld=false;fx=[];PT=[];trails=[];rewind=null;lockHold=null;fallAnim=null;history=[];
  energy=CFG.energyStart;pieces=0;placed=0;quads=0;undos=0;playMs=0;gameId=Math.max(Date.now(),gameId+1);
  best=bestFor(mode);
  document.body.classList.remove('mode-classic');document.body.classList.remove('mode-ghost');
  document.body.classList.add('mode-'+mode);

  showOverlay(null);showMenu(false);blurActive();

}
function pause(on){

/* --- журнал сыгранных игр --- */
const LOGKEY='ghostgrid-log';
function readLog(){try{const v=JSON.parse(localStorage.getItem(LOGKEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function writeLog(l){try{localStorage.setItem(LOGKEY,JSON.stringify(l.slice(-100)))}catch(e){}}
function saveGame(end){
  if(!gameId||placed===0)return;
  const l=readLog(),rec={id:gameId,mode,score,lines,level,quads,undos,dur:Math.round(playMs/1000),date:Date.now(),end};
  const i=l.findIndex(g=>g.id===gameId);if(i>=0)l[i]=rec;else l.push(rec);
  writeLog(l);
}
function bestFor(m){
  let b=0;readLog().forEach(g=>{if(g.mode===m&&g.score>b)b=g.score});
  if(m==='ghost'){try{b=Math.max(b,+localStorage.getItem('tetris-best')||0)}catch(e){}}
  return b;
}
const fmtTime=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtNum=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
addEventListener('pagehide',()=>{if(state==='run'||state==='pause')saveGame('quit')});

/* =====================================================================
   ЭФФЕКТЫ И ФИЗИКА
   Все таймеры идут по игровому времени gt: на паузе эффекты замирают.
   1 линия — ЛАЗЕРНЫЙ СРЕЗ: режущая головка проходит по ряду, блоки
             распадаются на половинки, искры отскакивают от стакана,
             капли расплава падают и застывают.
   2 линии — СИСТЕМНЫЙ СБОЙ: ряды рвутся по строкам, всплывает ошибка
             памяти, блоки рассыпаются на пиксели, которые прыгают и
             «телепортируются».
   3 линии — ВЗЛОМ: голографическая сетка превращает блоки в каркасы,
             код утекает вверх по спирали в канал связи, рёбра каркасов
             падают обломками.
   4 линии — ВЗРЫВ из боевиков: вспышка, огненный шар, дым, искры и
             раскалённые обломки блоков.
   ===================================================================== */
const rnd=(a,c)=>a+Math.random()*(c-a);
const clamp=(v,a,c)=>v<a?a:v>c?c:v;
const FXD={1:380,2:450,3:540,4:240};          /* сколько длится эффект до схлопывания рядов */
let PT=[];                                     /* частицы */
const HEX='0123456789ABCDEF';
function shake(a,d){if(a>=shakeAmp||gt>=shakeUntil){shakeAmp=a;shakeDur=d;shakeUntil=gt+d}}
function addP(o){
  PT.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,drag:0,bounce:.3,fric:.75,col:false,age:0,delay:0,life:600,rot:0,vr:0,s:2},o));
}
/* твёрдо ли в точке: стены, дно, занятые клетки (ряды, которые сейчас разрушаются, — пустые) */
function solid(px,py){
  if(px<0||px>=W*S||py>=H*S)return true;
  if(py<0)return false;
  const r=Math.floor(py/S),c=Math.floor(px/S);
  if(lockHold&&!lockHold.collapsed&&lockHold.full.includes(r))return false;
  return !!board[r][c];
}
function stepParticles(dt){
  const s=dt/1000;
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];
    if(p.delay>0){p.delay-=dt;continue}
    p.age+=dt;if(p.age>=p.life){PT.splice(i,1);continue}
    if(p.attr){const dx=p.attr.x-p.x,dy=p.attr.y-p.y,d=Math.hypot(dx,dy)+24,f=p.attr.k/d;
      p.vx+=(dx/d*f-dy/d*f*p.attr.swirl)*s;p.vy+=(dy/d*f+dx/d*f*p.attr.swirl)*s}
    if(!p.rest)p.vy+=p.g*s;
    if(p.drag){const k=Math.exp(-p.drag*s);p.vx*=k;p.vy*=k}
    const ox=p.x,oy=p.y;p.x+=p.vx*s;p.y+=p.vy*s;p.rot+=p.vr*s;
    if(p.rest){p.vx*=Math.exp(-7*s);p.vr*=Math.exp(-7*s);if(!solid(p.x,p.y+2))p.rest=false}
    if(p.glitch&&Math.random()<dt/70){p.x+=Math.round(rnd(-1,1))*S/3;p.alt=!p.alt}
    if(!p.col)continue;
    if(!solid(p.x,p.y))continue;
    if(solid(ox,oy)){p.col=false;continue}                 /* застряла внутри — пусть пролетит */
    if(!solid(ox,p.y)){p.x=ox;p.vx=-p.vx*p.bounce;p.vr*=-.6}
    else if(!solid(p.x,oy)){
      p.y=oy;
      if(p.vy>0){
        const v=p.vy;p.vy=-v*p.bounce;p.vx*=p.fric;p.vr*=.55;
        if(p.onHit)p.onHit(p,v);
        if(Math.abs(p.vy)<45){p.vy=0;p.rest=true}
      }else p.vy=-p.vy*p.bounce;
    }else{p.x=ox;p.y=oy;p.vx=-p.vx*p.bounce;p.vy=-p.vy*p.bounce}
  }
}
/* огненный шар один раз рисуется в заготовку, дальше только масштабируется */
let FB=null;
function fireBall(){if(FB)return FB;FB=document.createElement('canvas');FB.width=FB.height=64;const g=FB.getContext('2d');
  if(g&&g.createRadialGradient){const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,250,210,1)');gr.addColorStop(.35,'rgba(255,170,30,.9)');gr.addColorStop(1,'rgba(200,30,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}return FB}
function drawParticles(){
  for(const p of PT){
    if(p.delay>0)continue;
    const k=p.age/p.life;
    switch(p.k){
      case 'spark':{
        x.globalCompositeOperation='lighter';x.globalAlpha=1-k*k;
        x.strokeStyle=k<.25?'#fff6dc':k<.55?'#ffb347':'#ff5a2a';x.lineWidth=p.s;x.lineCap='round';
        const tl=p.rest?.004:.022;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-p.vx*tl,p.y-p.vy*tl);x.stroke();
        x.globalCompositeOperation='source-over';break}
      case 'ember':{
        x.globalCompositeOperation='lighter';x.globalAlpha=(1-k)*(.6+.4*Math.sin(p.age/40+p.s*9));
        x.fillStyle=p.c||'#ff9a4a';x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill();
        x.globalCompositeOperation='source-over';break}
      case 'drip':{
        x.globalCompositeOperation='lighter';x.globalAlpha=1;x.fillStyle='#ffd08a';
        x.beginPath();x.ellipse(p.x,p.y,p.s*.8,p.s*1.4,0,0,7);x.fill();
        x.globalAlpha=.35;x.fillRect(p.x-.6,p.y-p.vy*.03,1.2,p.vy*.03);
        x.globalCompositeOperation='source-over';break}
      case 'splat':{
        const h=1-k;x.globalCompositeOperation='lighter';x.globalAlpha=h;
        x.fillStyle=h>.6?'#ffe0a0':h>.3?'#ff8a3a':'#a8321e';
        x.beginPath();x.ellipse(p.x,p.y-1,p.s*2.2,p.s*.7,0,0,7);x.fill();
        x.globalCompositeOperation='source-over';break}
      case 'pix':{
        x.globalAlpha=k<.75?1:(1-k)/.25;
        if(Math.random()<.04)break;                                     /* мерцание битых пикселей */
        x.fillStyle=p.alt?p.c2:p.c;x.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
        if(p.alt){x.globalCompositeOperation='lighter';x.globalAlpha*=.6;x.fillStyle='#27f5e3';x.fillRect(p.x-p.s/2+2,p.y-p.s/2,p.s,p.s);x.globalCompositeOperation='source-over'}
        break}
      case 'glyph':{
        x.globalCompositeOperation='lighter';x.globalAlpha=(k<.15?k/.15:1)*(1-k*k);
        x.fillStyle=k<.3?'#eafff8':'#6fe0c8';x.font='bold '+p.s+'px '+MONO;x.textAlign='center';x.textBaseline='middle';
        x.fillText(p.ch,p.x,p.y);x.globalCompositeOperation='source-over';break}
      case 'seg':{
        x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.globalAlpha=1-k*k;
        x.strokeStyle=p.c||'#6fe0c8';x.lineWidth=1.6;x.beginPath();x.moveTo(-p.l/2,0);x.lineTo(p.l/2,0);x.stroke();x.restore();break}
      case 'chunk':{
        x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.globalAlpha=k<.75?1:(1-k)/.25;
        x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        x.fillStyle='rgba(0,0,0,.45)';x.fillRect(-p.w/2,p.h/2-2.5,p.w,2.5);
        const heat=Math.max(0,1-p.age/420);
        if(heat>0){x.globalCompositeOperation='lighter';x.globalAlpha=heat;x.fillStyle='#ffb050';x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.globalCompositeOperation='source-over'}
        x.restore();break}
      case 'dust':{
        x.globalAlpha=.32*(1-k);x.fillStyle=p.c||'#9fc7c0';
        x.beginPath();x.arc(p.x,p.y,p.s+(p.s2||10)*k,0,7);x.fill();break}
      case 'fire':{
        const r=p.r0+(p.r1-p.r0)*k;
        x.globalCompositeOperation='lighter';x.globalAlpha=1-k*k;x.drawImage(fireBall(),p.x-r,p.y-r,r*2,r*2);
        x.globalCompositeOperation='source-over';break}
      case 'smoke':{
        x.globalAlpha=.45*(1-k)*Math.min(1,k*6);x.fillStyle='#3e4a52';
        x.beginPath();x.arc(p.x,p.y,p.r0+(p.r1-p.r0)*k,0,7);x.fill();break}
      case 'ring':{
        x.globalAlpha=1-k;x.strokeStyle=p.c;x.lineWidth=p.lw*(1-k)+1;
        x.beginPath();x.arc(p.x,p.y,p.r1*Math.pow(k,.55),0,7);x.stroke();break}
    }
  }
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
}

/* --- запуск эффекта при очистке --- */
function spawnFx(n,rows,gone){
  const e={n,rows,gone,t0:gt,dur:FXD[n]+520,acc:0,seed:Math.random()*1e9|0};
  if(n===1){e.emit=0}
  if(n===2){e.err='0x'+Array.from({length:4},()=>HEX[Math.random()*16|0]).join('');e.burst=false}
  if(n===3){e.burst=false}
  if(n>=4)boom(e);
  fx.push(e);
}
const cy0=e=>(e.rows.reduce((a,r)=>a+r,0)/e.rows.length+.5)*S;

/* 4 линии: взрыв + обломки */
function boom(e){
  const cy=cy0(e);shake(9,480);
  addP({k:'ring',x:150,y:cy,r1:300,lw:10,c:'#ffd27a',life:700});
  addP({k:'ring',x:150,y:cy,r1:200,lw:5,c:'#ffffff',life:500,delay:60});
  addP({k:'fire',x:150,y:cy,r0:20,r1:130,life:800});
  for(let i=0;i<14;i++)addP({k:'fire',x:rnd(10,290),y:e.rows[i%e.rows.length]*S+rnd(0,S),vx:rnd(-40,40),vy:rnd(-90,-10),r0:rnd(12,24),r1:rnd(45,80),life:rnd(500,850),delay:rnd(0,220),drag:.3});
  for(let i=0;i<(Q===2?70:35);i++){const a=rnd(0,6.283),v=rnd(140,520);addP({k:'spark',x:150+rnd(-60,60),y:cy+rnd(-20,20),vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,g:900,life:rnd(500,1100),s:rnd(1.4,3.2),col:true,bounce:.45,fric:.7})}
  for(let i=0;i<12;i++)addP({k:'smoke',x:rnd(20,280),y:cy+rnd(-40,40),vx:rnd(-15,15),vy:rnd(-50,-15),r0:rnd(16,26),r1:rnd(50,80),life:rnd(800,1200),delay:rnd(150,450)});
  e.rows.forEach((r,ri)=>{for(let c=0;c<W;c++){
    const col=COL[e.gone[ri][c]]||'#6fe0c8';
    for(let j=0;j<(Q===2||c%2?2:1);j++){const px=c*S+rnd(6,S-6),py=r*S+rnd(6,S-6),dx=px-150,dy=py-cy,d=Math.hypot(dx,dy)+30,v=rnd(260,620);
      addP({k:'chunk',x:px,y:py,vx:dx/d*v+rnd(-60,60),vy:dy/d*v-rnd(160,380),g:1400,rot:rnd(0,6.3),vr:rnd(-16,16),w:rnd(7,13),h:rnd(6,11),c:col,life:rnd(900,1500),col:true,bounce:.38,fric:.72})}
  }});
}

/* обновление эффектов (испускание частиц по времени) */
function updateFx(dt){
  for(const e of fx){
    const t=gt-e.t0;
    if(e.n===1){                                                     /* лазер: искры от головки */
      const L=laserState(e,t);
      if(L.on&&L.u<1){
        e.emit+=dt*.5;
        while(e.emit>=1){e.emit--;
          addP({k:'spark',x:L.hx+rnd(-3,3),y:L.cy+rnd(-2,2),vx:rnd(-260,90),vy:rnd(-300,40),g:1500,life:rnd(380,850),s:rnd(1,2.2),col:true,bounce:.45,fric:.72});
          if(Math.random()<.09)addP({k:'drip',x:L.hx-rnd(0,12),y:L.cy+S*.3,vx:rnd(-25,25),vy:rnd(10,70),g:1100,life:1600,s:rnd(1.3,2.2),col:true,bounce:0,fric:0,
            onHit:p=>{p.k='splat';p.vx=p.vy=0;p.g=0;p.col=false;p.age=0;p.life=rnd(600,900);p.y+=1}});
          if(Math.random()<.18)addP({k:'ember',x:L.hx-rnd(0,40),y:L.cy+rnd(-4,4),vx:rnd(-20,20),vy:rnd(-60,-20),g:-40,drag:1.5,life:rnd(500,900),s:rnd(.8,1.6)});
        }
      }
    }
    if(e.n===2&&!e.burst&&t>=170){e.burst=true;                         /* сбой: распад на пиксели */
      e.rows.forEach((r,ri)=>{for(let c=0;c<W;c++){
        const col=COL[e.gone[ri][c]]||'#6fe0c8';
        const pn=Q===2?3:2;for(let a=0;a<pn;a++)for(let b2=0;b2<pn;b2++){
          const px=c*S+Math.round((a+.5)*S/pn),py=r*S+Math.round((b2+.5)*S/pn),bad=Math.random()<.18;
          addP({k:'pix',x:px,y:py,vx:(px-150)*rnd(.5,1.6)+rnd(-90,90),vy:rnd(-320,-40),g:1350,s:rnd(4,8),c:bad?'#ff2a6d':tint(col,rnd(.6,1.05)),c2:bad?'#27f5e3':tint(col,1.35),
            glitch:Math.random()<.5,life:rnd(520,950),col:true,bounce:.35,fric:.6,rot:0});
        }
      }});
      shake(3,160);
    }
    if(e.n===3&&!e.burst&&t>=230){e.burst=true;                         /* взлом: код уходит вверх, каркасы рассыпаются */
      const up={x:150,y:-60,k:240000,swirl:.45};
      e.rows.forEach(r=>{for(let c=0;c<W;c++){
        for(let j=0;j<3;j++)addP({k:'glyph',ch:HEX[Math.random()*16|0],x:c*S+rnd(5,S-5),y:r*S+rnd(5,S-5),vx:rnd(-70,70),vy:rnd(-260,-90),attr:up,drag:1.3,life:rnd(700,1150),s:Math.round(rnd(10,15)),delay:rnd(0,120)});
        const X=c*S,Y=r*S,e4=[[X+S/2,Y+2,0],[X+S/2,Y+S-2,0],[X+2,Y+S/2,1.5708],[X+S-2,Y+S/2,1.5708]];
        e4.forEach(([px,py,a])=>addP({k:'seg',x:px,y:py,rot:a,l:S-6,vx:(px-150)*rnd(.2,.7)+rnd(-50,50),vy:rnd(-220,-40),vr:rnd(-12,12),g:1250,life:rnd(600,950),col:true,bounce:.3,fric:.6,c:Math.random()<.25?'#e0508f':'#6fe0c8'}));
      }});
    }
  }
  fx=fx.filter(e=>gt-e.t0<e.dur);
}
function laserState(e,t){
  const ts=70,sw=270,u=clamp((t-ts)/sw,0,1),cy=(e.rows[0]+.5)*S;
  return {ts,sw,u,cy,hx:-6+312*u,on:t>=ts&&t<=ts+sw+60};
}
/* обрезка по прямоугольнику и отрисовка спрайта блока */
function clipCell(c,r,col,cx,cy,cw,ch,dx,dy,a){
  x.save();x.beginPath();x.rect(cx,cy,cw,ch);x.clip();x.translate(dx,dy);cell(x,c,r,S,col,a);x.restore();
}
function drawFx(){
  for(const e of fx){
    const t=gt-e.t0,collapsedHere=!lockHold||lockHold.collapsed;
    if(e.n===1){
      const L=laserState(e,t),r=e.rows[0],Y=r*S;
      if(!collapsedHere){
        for(let c=0;c<W;c++){
          const col=COL[e.gone[0][c]]||'#6fe0c8',tc=L.ts+L.sw*((c+.5)/W);
          if(t<tc){cell(x,c,r,S,col);
            const d=Math.abs((c+.5)*S-L.hx);if(L.on&&d<S*1.5){x.globalCompositeOperation='lighter';x.globalAlpha=(1-d/(S*1.5))*.5;x.fillStyle='#ff2a6d';x.fillRect(c*S,Y,S,S);x.globalCompositeOperation='source-over';x.globalAlpha=1}
          }else{
            const k=clamp((t-tc)/(FXD[1]-tc+40),0,1),sep=1+6*(1-Math.pow(1-k,3)),a=1-k*k;

    const below=r+1<H?fallAnim.rows[r+1]:null,floor=below?below.off:0,floorMoving=below&&(below.v!==0||below.off!==0);

  const l=readLog();
  const n=l.length,n10=n%10,n100=n%100,word=n10===1&&n100!==11?'игра':n10>=2&&n10<=4&&(n100<12||n100>14)?'игры':'игр';
  $('mLogSub').textContent=n?n+' '+word+' · рекорд '+fmtNum(Math.max(bestFor('classic'),bestFor('ghost'))):'пока пусто';
}
function renderLog(){
  const l=readLog(),games=l.length,sum=k=>l.reduce((a,g)=>a+(+g[k]||0),0);
  const tiles=[['Игр',games],['Время в игре',fmtTime(sum('dur')*1000)],['Линий',fmtNum(sum('lines'))],['Квадро',sum('quads')],['Рекорд, классика',fmtNum(bestFor('classic'))],['Рекорд, призрак',fmtNum(bestFor('ghost'))]];
  $('tiles').innerHTML=tiles.map(([a,v])=>'<div class="tile"><span>'+a+'</span><b>'+pxSVG(v)+'</b></div>').join('');
  if(!games){$('glist').innerHTML='<div class="empty">Здесь появятся сыгранные партии.</div>';return}
  const recent=l.slice().reverse().slice(0,40),mx=Math.max(1,...recent.map(g=>g.score));
  const p2=n=>String(n).padStart(2,'0');
  $('glist').innerHTML=recent.map(g=>{
    const d=new Date(g.date),gh=g.mode==='ghost';
    return '<div class="gi '+(gh?'g':'c')+'"><div class="gl"><span class="gtag">'+(gh?'Призрак':'Классика')+'</span><span>'+p2(d.getDate())+'.'+p2(d.getMonth()+1)+' · '+p2(d.getHours())+':'+p2(d.getMinutes())+'</span>'+(g.end==='quit'?'<span class="gq">прервана</span>':'')+'</div>'+
      '<b class="gsc">'+pxSVG(fmtNum(g.score))+'</b><div class="gx">'+g.lines+' лин · ур '+g.level+' · '+fmtTime(g.dur*1000)+(g.quads?' · квадро ×'+g.quads:'')+(gh&&g.undos?' · отмен '+g.undos:'')+'</div>'+
      '<i class="gbar" style="width:'+Math.round(g.score/mx*100)+'%"></i></div>';
  }).join('');
}
function drawIcons(){
  const s=14;
  const pic=(id,rows,extra)=>{const c=$(id);const g=c&&c.getContext&&c.getContext('2d');if(!g||!g.clearRect)return;
    g.clearRect(0,0,c.width,c.height);
    rows.forEach((line,r)=>[...line].forEach((ch,cc)=>{if(ch==='.')return;
      if(ch==='X')vcell(g,cc,r,s,0);else if(ch===ch.toLowerCase())cell(g,cc,r,s,COL[ch.toUpperCase()],.35);else cell(g,cc,r,s,COL[ch])}));
    extra&&extra(g)};
  pic('icC',['............','....TTT.....','.....T......','............','J.........SS','JJJ.OO...SS.','LLZZOOIIII.L']);
  pic('icG',['............','....zz......','.....zz.....','............','T........JJJ','TTX.OO...X.J','LTXXOOIIII.L'],g=>{
    const M=['..#.......','.##.......','########..','.##.....#.','..#......#','.........#','.........#','........#.','.#######..'];g.fillStyle='#6fe0c8';M.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='#')g.fillRect(8.4*s+c*2,0.6*s+r*2,2,2)}));
  });
}

/* --- клавиатура --- */
addEventListener('keydown',e=>{
  const k=e.code;
  if(state==='menu'){menuKey(e);return}
  if(state==='over'){
    if((k==='Enter'||k==='Space')&&!e.repeat){e.preventDefault();start();return}
    if(k==='KeyZ'||k==='Backspace'){e.preventDefault();undo();return}
    if(k==='Escape'||k==='KeyM'){e.preventDefault();toMenu();return}
    if(k==='Space')e.preventDefault();
    return;
  }
  if(state==='pause'){
    e.preventDefault();
    if(e.repeat)return;
    if(k==='KeyP'||k==='Escape'||k==='Enter'||k==='Space')pause(false);
    else if(k==='KeyM')toMenu();
    else if(k==='KeyR')start();
    return;
  }
  if(state!=='run')return;
  if(k==='KeyP'||k==='Escape'){e.preventDefault();pause(true);return}
  if(k==='KeyZ'||k==='Backspace'){e.preventDefault();undo();return}
  if(k==='Space'){
    e.preventDefault();
    if(e.repeat)return;
    hardDrop();spaceHeld=true;spaceAcc=-150;
    return;
  }
  if(k==='ArrowDown'){
    e.preventDefault();
    if(!e.repeat){fastKeys.add(k);fastStart=performance.now();drop();acc=0}
    return;
  }
  if(k==='ArrowLeft'){e.preventDefault();move(-1)}
  else if(k==='ArrowRight'){e.preventDefault();move(1)}
  else if(k==='ArrowUp'){e.preventDefault();if(!e.repeat)tryRotate()}
});
addEventListener('keyup',e=>{fastKeys.delete(e.code);if(e.code==='Space')spaceHeld=false});
addEventListener('blur',()=>{fastKeys.clear();btnFast=false;spaceHeld=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run')pause(true)});

/* --- кнопки на экране --- */
const P=a=>document.querySelector('.pad [data-a="'+a+'"]');
P('undo').addEventListener('pointerdown',e=>{e.preventDefault();undo()});
/* крестовина: ←/→ с автоповтором при удержании, ↓ — быстрое падение, пока держишь (после приземления нужно нажать заново), центр — поворот */
const RPT={};
function padHold(a,fn,first){
  const el=P(a);if(!el)return;
  const stop=()=>{if(RPT[a]){clearTimeout(RPT[a].t);clearInterval(RPT[a].i);RPT[a]=null}if(el.classList)el.classList.remove('held');if(a==='down')btnFast=false};
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='run')return;if(el.setPointerCapture&&e.pointerId!=null)try{el.setPointerCapture(e.pointerId)}catch(x){}
    stop();if(el.classList)el.classList.add('held');fn(true);
    if(first)RPT[a]={t:setTimeout(()=>{RPT[a].i=setInterval(()=>{if(state==='run')fn(false);else stop()},first[1])},first[0]),i:0}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,stop));
}
padHold('left',()=>move(-1),[170,55]);
padHold('right',()=>move(1),[170,55]);
padHold('rot',()=>tryRotate());
/* ↓: короткое нажатие — шаг вниз, удержание 0,3 с — фигура сразу падает до конца (только та, на которой нажали) */
(function(){const el=P('down');if(!el)return;let t=null,pid=-1;
  const stop=()=>{if(t){clearTimeout(t);t=null}if(el.classList)el.classList.remove('held')};
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='run')return;if(el.setPointerCapture&&e.pointerId!=null)try{el.setPointerCapture(e.pointerId)}catch(x){}
    stop();if(el.classList)el.classList.add('held');pid=spawnN;drop();acc=0;
    t=setTimeout(()=>{t=null;if(state==='run'&&pid===spawnN&&!lockHold&&cur)hardDrop();if(el.classList)el.classList.remove('held')},300)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,stop));
})();
P('pause').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='run')pause(true);else if(state==='pause')pause(false)});
[['pResume',()=>pause(false)],['pRestart',()=>start()],['pMenu',()=>toMenu()],['oUndo',()=>undo()],['oAgain',()=>start()],['oMenu',()=>toMenu()]]
  .forEach(([id,fn])=>$(id).addEventListener('click',e=>{fn();blurActive()}));

/* --- свайпы и тап на телефоне: ←/→ двигают, ↓ опускает, быстрый свайп ↓ сбрасывает, тап вращает --- */
let sw=null;
const cellPx=()=>(cv.getBoundingClientRect().width||300)/W;
function swDown(e){
  if(e.pointerType==='mouse'||sw||state!=='run')return;
  if(e.target&&e.target.closest&&e.target.closest('button'))return;
  const n=performance.now();
  sw={id:e.pointerId,x0:e.clientX,y0:e.clientY,ax:e.clientX,ay:e.clientY,t0:n,moved:false,hist:[{t:n,y:e.clientY}]};
}
function swMove(e){
  if(!sw||e.pointerId!==sw.id)return;
  const n=performance.now(),cp=cellPx(),sx=cp*.8,sy=cp*1.1;
  sw.hist.push({t:n,y:e.clientY});if(sw.hist.length>8)sw.hist.shift();
  if(!sw.moved&&Math.hypot(e.clientX-sw.x0,e.clientY-sw.y0)>12)sw.moved=true;
  if(sw.dead)return;
  if(!sw.moved||state!=='run'||lockHold||!cur){sw.ax=e.clientX;sw.ay=e.clientY;return}
  /* жест управляет только той фигурой, с которой начался: приземлилась — до отпускания пальца жест не действует */
  if(sw.pid==null)sw.pid=spawnN;else if(sw.pid!==spawnN){sw.dead=true;return}
  /* ось жеста: пока палец идёт вниз, боковые дрожания игнорируются; сменить ось можно только явным движением (>2 клеток) */
  if(!sw.axis){const dx=Math.abs(e.clientX-sw.x0),dy=e.clientY-sw.y0;sw.axis=(dy>0&&dy>=dx*.6)?'v':'h';sw.bx=e.clientX;sw.by=e.clientY}
  if(sw.axis==='v'&&Math.abs(e.clientX-sw.bx)>cp*2){sw.axis='h';sw.ax=e.clientX;sw.by=e.clientY}
  else if(sw.axis==='h'&&e.clientY-sw.by>cp*2&&e.clientY-sw.by>Math.abs(e.clientX-sw.bx)*1.5){sw.axis='v';sw.ay=e.clientY;sw.bx=e.clientX;sw.ax=e.clientX}
  if(sw.axis==='v')sw.ax=e.clientX;else if(e.clientY<sw.by)sw.by=e.clientY;
  if(sw.axis==='h'){
    while(e.clientX-sw.ax>=sx){move(1);sw.ax+=sx}
    while(sw.ax-e.clientX>=sx){move(-1);sw.ax-=sx}
    sw.ay=e.clientY;
  }else{
    if(e.clientY<sw.ay)sw.ay=e.clientY;
    while(e.clientY-sw.ay>=sy){
      sw.ay+=sy;
      if(!drop()){sw.ay=e.clientY;break}
    }
  }
}
function swUp(e){
  if(!sw||e.pointerId!==sw.id)return;
  const s=sw;sw=null;
  if(s.dead||state!=='run'||lockHold||!cur||(s.pid!=null&&s.pid!==spawnN))return;
  if(!s.moved){if(performance.now()-s.t0<350)tryRotate();return}
  const dyT=e.clientY-s.y0,dxT=e.clientX-s.x0,h=s.hist,last=h[h.length-1];
  let first=last;for(const p of h)if(last.t-p.t<=100){first=p;break}
  const vy=(last.y-first.y)/Math.max(1,last.t-first.t);
  if(dyT>cellPx()*2&&vy>.9&&Math.abs(dxT)<dyT*.7)hardDrop();
}
document.addEventListener('pointerdown',swDown);
document.addEventListener('pointermove',swMove);
document.addEventListener('pointerup',swUp);
document.addEventListener('pointercancel',()=>{sw=null});

board=Array.from({length:H},()=>Array(W).fill(0));
document.querySelectorAll('[data-px]').forEach(el=>setPx(el,el.dataset.px));
ui();showMenu(true);
requestAnimationFrame(frame);
</script>
